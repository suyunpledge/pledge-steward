name: android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch forge kernel (pin)
        run: python scripts/fetch-forge.py

      - name: bridge deps
        run: pip install fastapi uvicorn websockets pydantic httpx

      - name: verify rootfs layout (PC simulation)
        run: python tools/verify-rootfs-layout.py

      - name: offline contract smoke
        run: python tests/smoke_rt.py

      - name: assemble debug APK
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: steward-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
